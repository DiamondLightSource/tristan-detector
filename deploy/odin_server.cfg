[server]
debug_mode  = 0
http_port   = 8888
http_addr   = 0.0.0.0
static_path = /odin/html/static
adapters    = fp, fr, meta_listener, tristan

[tornado]
logging = error

# Update these endpoints for your deployment
[adapter.fp]
module = odin_data.frame_processor_adapter.FrameProcessorAdapter
endpoints = 127.0.0.1:10004, 127.0.0.1:10014, 127.0.0.1:10024, 127.0.0.1:10034
update_interval = 0.2

# Update these endpoints for your deployment
[adapter.fr]
module = odin_data.frame_receiver_adapter.FrameReceiverAdapter
endpoints = 127.0.0.1:10000, 127.0.0.1:10010, 127.0.0.1:10020, 127.0.0.1:10030
update_interval = 0.2

[adapter.meta_listener]
module = odin_data.meta_listener_adapter.MetaListenerAdapter
endpoints = 127.0.0.1:5659
update_interval = 0.5

[adapter.tristan]
module = tristan_detector.control.tristan_adapter.TristanAdapter
endpoint = tcp://*:99100
firmware = 1.0.0
