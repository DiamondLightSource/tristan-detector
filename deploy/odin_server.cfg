[server]
debug_mode  = 0
http_port   = 8888
http_addr   = 0.0.0.0
static_path = /odin/html/static
adapters    = fp, fr, tristan

[tornado]
logging = error

# Update these endpoints for your deployment
[adapter.fp]
module = odin_data.control.frame_processor_adapter.FrameProcessorAdapter
endpoints = 127.0.0.1:10004
update_interval = 0.2

# Update these endpoints for your deployment
[adapter.fr]
module = odin_data.control.frame_receiver_adapter.FrameReceiverAdapter
endpoints = 127.0.0.1:10000
update_interval = 0.2

# meta_listener requires a meta writer running on port 5659
# [adapter.meta_listener]
# module = odin_data.control.meta_listener_adapter.MetaListenerAdapter
# endpoints = 127.0.0.1:5659
# update_interval = 0.5

[adapter.tristan]
module = tristan_detector.control.tristan_adapter.TristanControlAdapter
endpoint = tcp://*:99100
firmware = 1.0.0
