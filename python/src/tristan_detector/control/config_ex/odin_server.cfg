[server]
debug_mode  = 0
http_port   = 8888
http_addr   = 0.0.0.0
static_path = /dls_sw/work/tools/RHEL7-x86_64/tristan-detector/prefix/html/static
adapters    = fp, fr, tristan, meta_listener

[tornado]
logging = error

[adapter.tristan]
module = tristan_detector.control.tristan_adapter.TristanControlAdapter
endpoint = tcp://127.0.0.1:27654
firmware = 0.0.1

[adapter.fp]
module = odin_data.control.frame_processor_adapter.FrameProcessorAdapter
endpoints = 127.0.0.1:10004, 127.0.0.1:10014, 127.0.0.1:10024, 127.0.0.1:10034, 127.0.0.1:10044, 127.0.0.1:10054, 127.0.0.1:10064, 127.0.0.1:10074
update_interval = 0.2

[adapter.fr]
module = odin_data.control.frame_receiver_adapter.FrameReceiverAdapter
endpoints = 127.0.0.1:10000, 127.0.0.1:10010, 127.0.0.1:10020, 127.0.0.1:10030, 127.0.0.1:10040, 127.0.0.1:10050, 127.0.0.1:10060, 127.0.0.1:10070
update_interval = 0.2

[adapter.meta_listener]
module = odin_data.control.meta_listener_adapter.MetaListenerAdapter
endpoints = 127.0.0.1:5659
update_interval = 0.5
