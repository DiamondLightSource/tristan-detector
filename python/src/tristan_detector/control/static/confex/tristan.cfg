[server]
debug_mode = 1
http_port  = 8888
http_addr  = 0.0.0.0
static_path = tristan_detector/static
adapters   = tristan,fr,fp, meta_listener

[tornado]
logging = info

[adapter.tristan]
module = tristan_detector.control.tristan_adapter.TristanControlAdapter
endpoint = tcp://127.0.0.1:7002
update_interval = 2
firmware = 0.0.1
udp_file = ./udp_tristan.json

[adapter.fr]
module = odin_data.control.frame_receiver_adapter.FrameReceiverAdapter
endpoints = 172.23.98.116:5000
update_interval = 2

[adapter.fp]
module = odin_data.control.frame_processor_adapter.FrameProcessorAdapter
endpoints = 172.23.98.117:5004
update_interval = 2

[adapter.meta_listener]
module = odin_data.control.meta_listener_adapter.MetaListenerAdapter
ip_address = 172.23.98.116
endpoints = 172.23.98.116:5558

